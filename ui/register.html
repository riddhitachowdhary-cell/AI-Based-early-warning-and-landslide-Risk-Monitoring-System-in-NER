<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register | LandSafe Connect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="bg-light">


<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="row w-100 justify-content-center">

        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">


            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">


                    <!-- Brand -->

                    <div class="text-center mb-4">

                        <div class="mb-3">

                            <i
                                class="bi bi-shield-check text-success fs-1">
                            </i>

                        </div>

                        <h2 class="fw-bold mb-1">
                            LandSafe Connect
                        </h2>

                        <p class="text-muted mb-0">
                            Safer Tomorrow
                        </p>

                    </div>


                    <div class="text-center mb-4">

                        <h4 class="fw-bold">
                            Create Account
                        </h4>

                        <p class="text-muted">
                            Join LandSafe Connect
                        </p>

                    </div>


                    <!-- Account Type -->

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Register As

                        </label>


                        <div class="row g-2">


                            <div class="col-6">

                                <input
                                    type="radio"
                                    class="btn-check"
                                    name="accountType"
                                    id="userRegister"
                                    value="user"
                                    checked>

                                <label
                                    class="btn btn-outline-success w-100 py-3"
                                    for="userRegister">

                                    <i
                                        class="bi bi-person fs-5 d-block mb-1">
                                    </i>

                                    User

                                </label>

                            </div>


                            <div class="col-6">

                                <input
                                    type="radio"
                                    class="btn-check"
                                    name="accountType"
                                    id="adminRegister"
                                    value="admin">

                                <label
                                    class="btn btn-outline-success w-100 py-3"
                                    for="adminRegister">

                                    <i
                                        class="bi bi-shield-lock fs-5 d-block mb-1">
                                    </i>

                                    Admin

                                </label>

                            </div>


                        </div>

                    </div>


                    <!-- Full Name -->

                    <div class="mb-3">

                        <label
                            for="fullName"
                            class="form-label fw-semibold">

                            Full Name

                        </label>


                        <div class="input-group">

                            <span class="input-group-text bg-white">

                                <i class="bi bi-person"></i>

                            </span>


                            <input
                                type="text"
                                class="form-control"
                                id="fullName"
                                placeholder="Enter your full name">

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label fw-semibold">

                            Email Address

                        </label>


                        <div class="input-group">

                            <span class="input-group-text bg-white">

                                <i class="bi bi-envelope"></i>

                            </span>


                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email">

                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="mb-3">

                        <label
                            for="phone"
                            class="form-label fw-semibold">

                            Phone Number

                        </label>


                        <div class="input-group">

                            <span class="input-group-text bg-white">

                                <i class="bi bi-telephone"></i>

                            </span>


                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                placeholder="Enter your phone number">

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label fw-semibold">

                            Password

                        </label>


                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Create a password">

                    </div>


                    <!-- Confirm Password -->

                    <div class="mb-3">

                        <label
                            for="confirmPassword"
                            class="form-label fw-semibold">

                            Confirm Password

                        </label>


                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm your password">

                    </div>


                    <!-- Terms -->

                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms">

                        <label
                            class="form-check-label"
                            for="terms">

                            I agree to the LandSafe Connect terms and
                            privacy policy.

                        </label>

                    </div>


                    <!-- Register Button -->

                    <button
                        type="button"
                        class="btn btn-success w-100 py-2"
                        id="registerBtn">

                        <i class="bi bi-person-plus me-2"></i>

                        Create Account

                    </button>


                    <!-- Login -->

                    <div class="text-center mt-4">

                        <p class="text-muted mb-0">

                            Already have an account?

                            <a
                                href="login.html"
                                class="text-success fw-semibold text-decoration-none">

                                Login

                            </a>

                        </p>

                    </div>


                </div>

            </div>


            <p class="text-center text-muted small mt-3">

                LandSafe Connect • AI-powered disaster risk assessment

            </p>


        </div>

    </div>

</div>


<script src="register.js"></script>

</body>

</html>
