<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | LandSafe Connect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <!-- Logo / Brand -->

                        <div class="text-center mb-4">

                            <div class="mb-3">
                                <i class="bi bi-shield-check text-success fs-1"></i>
                            </div>

                            <h2 class="fw-bold mb-1">
                                LandSafe Connect
                            </h2>

                            <p class="text-muted mb-0">
                                Safer Tomorrow
                            </p>

                        </div>


                        <div class="text-center mb-4">

                            <h4 class="fw-bold">
                                Welcome Back
                            </h4>

                            <p class="text-muted">
                                Login to continue to your dashboard
                            </p>

                        </div>


                        <!-- Account Type -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Login As
                            </label>

                            <div class="row g-2">

                                <div class="col-6">

                                    <input
                                        type="radio"
                                        class="btn-check"
                                        name="accountType"
                                        id="userLogin"
                                        value="user"
                                        checked>

                                    <label
                                        class="btn btn-outline-success w-100 py-3"
                                        for="userLogin">

                                        <i class="bi bi-person fs-5 d-block mb-1"></i>

                                        User

                                    </label>

                                </div>


                                <div class="col-6">

                                    <input
                                        type="radio"
                                        class="btn-check"
                                        name="accountType"
                                        id="adminLogin"
                                        value="admin">

                                    <label
                                        class="btn btn-outline-success w-100 py-3"
                                        for="adminLogin">

                                        <i class="bi bi-shield-lock fs-5 d-block mb-1"></i>

                                        Admin

                                    </label>

                                </div>

                            </div>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold">

                                Email Address

                            </label>

                            <div class="input-group">

                                <span class="input-group-text bg-white">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="Enter your email"
                                    required>

                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label fw-semibold">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text bg-white">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Enter your password"
                                    required>

                                <button
                                    class="btn btn-outline-secondary"
                                    type="button"
                                    id="togglePassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>


                        <!-- Remember -->

                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="rememberMe">

                                <label
                                    class="form-check-label"
                                    for="rememberMe">

                                    Remember me

                                </label>

                            </div>

                            <a
                                href="#"
                                class="text-success text-decoration-none">

                                Forgot Password?

                            </a>

                        </div>


                        <!-- Login Button -->

                        <button
                            type="button"
                            class="btn btn-success w-100 py-2"
                            id="loginBtn">

                            <i class="bi bi-box-arrow-in-right me-2"></i>

                            Login

                        </button>


                        <!-- Register -->

                        <div class="text-center mt-4">

                            <p class="text-muted mb-0">

                                Don't have an account?

                                <a
                                    href="register.html"
                                    class="text-success fw-semibold text-decoration-none">

                                    Create Account

                                </a>

                            </p>

                        </div>

                    </div>

                </div>


                <p class="text-center text-muted small mt-3">

                    LandSafe Connect • AI-powered disaster risk assessment

                </p>

            </div>

        </div>

    </div>


    <script src="login.js"></script>
    <script src="logout.js"></script>


</body>

</html>
